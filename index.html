<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRMS Portal Prototype</title>
    <meta
      name="description"
      content="A working HRMS portal prototype with role-based login, attendance, employee onboarding, and activity tracking."
    />
    <link rel="stylesheet" href="./styles.css?v=20260813-updates7" />
  </head>
  <body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <img class="topbar-logo" src="./avanzar-logo.png" alt="Avanzar IT Consulting" />
          <div>
            <p class="eyebrow">Prototype workspace</p>
            <h1>HRMS Portal</h1>
            <p class="lede">
              Attendance, employee onboarding, location-aware check-ins, and activity tracking
              in one extensible place.
            </p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn hidden" id="notificationBtn" type="button" aria-label="Notifications">
            <span class="notification-btn__icon">&#128276;</span>
            <span class="notification-btn__badge hidden" id="notificationBadge">0</span>
          </button>
          
          <button class="primary-btn" id="logoutBtn" type="button">Log out</button>
        </div>
      </header>

      <main id="app"></main>
    </div>
    <script type="module" src="./app.js?v=20260813-updates7"></script>
  </body>
</html>
